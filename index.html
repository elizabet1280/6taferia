    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes fall {
            0% { transform: translateY(-10vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(100vh) rotate(720deg); opacity: 0; }
        }
        @keyframes snowfall {
            0% { transform: translate3d(0, -12vh, 0) rotate(0deg); }
            50% { transform: translate3d(16px, 48vh, 0) rotate(180deg); }
            100% { transform: translate3d(-10px, 108vh, 0) rotate(360deg); }
        }
        @keyframes christmas-twinkle {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
                box-shadow: 0 0 8px 2px currentColor, 0 2px 14px 3px currentColor;
            }
            45% {
                opacity: 0.34;
                transform: scale(0.92);
                box-shadow: 0 0 2px 0px currentColor;
            }
            55% {
                opacity: 0.38;
                transform: scale(0.93);
                box-shadow: 0 0 3px 0px currentColor;
            }
        }
        @media (prefers-reduced-motion: reduce) {
            .snowflake-item {
                animation: none !important;
                display: none;
            }
            .christmas-bulb {
                animation: none !important;
                opacity: 0.95;
                box-shadow: 0 0 6px 1px currentColor;
            }
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Montserrat"', 'system-ui', '-apple-system', 'sans-serif'],

                    },
                    colors: {

                        },

                        'brand-red': '#A3363D',

                        'brand-green': '#3F6B45',
                        'brand-green-deep': '#2E4F35',
                        'brand-line': '#E5DAC0',
                        'brand-gold': '#FFE9B8',
                        'brand-dark': '#2E4F35',
                    },
                    boxShadow: {
                        'neon-accent': '0 6px 18px rgba(163, 54, 61, 0.28)',
                        'neon-countdown': '0 10px 30px rgba(43, 43, 43, 0.10)',
                        'card-warm': '0 10px 30px rgba(43, 43, 43, 0.10)',
                    },
                    keyframes: {
                        'neon-pulse': {
                            '0%, 100%': { 
                                boxShadow: '0 6px 18px rgba(163, 54, 61, 0.35)',
                                transform: 'scale(1)' 
                            },
                            '50%': { 
                                boxShadow: '0 10px 26px rgba(163, 54, 61, 0.55)',

                            },

                            },

                        'pulse-color': {
                            '0%, 100%': {

                                transform: 'scale(1)'

                            '0%, 100%': {
                                transform: 'translateY(0)',
                            },

                                transform: 'translateY(-6px)',

                        'pulse-color': 'pulse-color 2.5s infinite ease-in-out',
                        'neon-pulse-whatsapp': 'neon-pulse-whatsapp 2.5s infinite ease-in-out',
                        'levitate': 'levitate 3.5s ease-in-out infinite',
                    }
                }
            }
